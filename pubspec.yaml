
name: simulador
description: "SafeTap - Simulador de funciones básicas del celular para adultos mayores."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  camera: ^0.12.2
  path_provider: ^2.1.6
  path: ^1.9.1
  image_picker: ^1.2.4
  flutter_image_cropper: ^0.0.2
  shared_preferences: ^2.5.6
  image: ^4.12.0
  image_cropper: ^13.0.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # PAQUETE PARA GENERAR EL ICONO DE LA APLICACIÓN
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # IMÁGENES DE LA APLICACIÓN
  assets:
    - assets/images/

# CONFIGURACIÓN DEL ICONO OFICIAL DE SAFETAP
flutter_launcher_icons:
  android: true
  ios: false

  # ICONO PRINCIPAL
  image_path: "assets/images/safeTapLogo.png"

  # ICONO ADAPTABLE DE ANDROID
  adaptive_icon_background: "#EFF6FF"
  adaptive_icon_foreground: "assets/images/safeTapLogo.png"
